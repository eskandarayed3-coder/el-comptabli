<body class="bg-background min-h-screen flex flex-col items-center selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Header / TopAppBar Mockup -->
<header class="w-full max-w-[600px] flex items-center px-container-padding py-base sticky top-0 bg-background z-10">
<button aria-label="Retour" class="p-2 rounded-full hover:bg-surface-container transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[600px] px-container-padding flex flex-col items-center justify-start pt-12 fade-in">
<!-- Illustration/Icon placeholder -->
<div class="mb-8 w-20 h-20 bg-tint-success rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[40px]" style="font-variation-settings: 'FILL' 1;">mail</span>
</div>
<!-- Text Content -->
<section class="text-center mb-10 space-y-3">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background tracking-tight">Vérifie ton email</h1>
<p class="font-body-lg text-body-lg text-text-secondary max-w-[280px] mx-auto">
                Saisis le code à 6 chiffres envoyé à ton adresse email.
            </p>
</section>
<!-- OTP Group -->
<div class="flex gap-2 sm:gap-3 justify-center mb-8" id="otp-container">
<input class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center text-headline-sm font-headline-sm bg-surface-container-low border-none rounded-xxl text-primary" maxlength="1" readonly="" type="text" value="4"/>
<input class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center text-headline-sm font-headline-sm bg-surface-container-low border-none rounded-xxl text-primary" maxlength="1" readonly="" type="text" value="8"/>
<input class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center text-headline-sm font-headline-sm bg-surface-container-low border-none rounded-xxl text-primary" maxlength="1" readonly="" type="text" value="2"/>
<input autofocus="" class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center text-headline-sm font-headline-sm bg-white border-2 border-primary-container rounded-xxl text-primary focus:ring-2 focus:ring-primary" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center text-headline-sm font-headline-sm bg-surface-container-low border-none rounded-xxl text-primary" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center text-headline-sm font-headline-sm bg-surface-container-low border-none rounded-xxl text-primary" maxlength="1" type="text"/>
</div>
<!-- Timer & Resend -->
<div class="flex flex-col items-center space-y-4">
<div class="flex items-center gap-2 text-text-secondary">
<span class="material-symbols-outlined text-[18px]">schedule</span>
<span class="font-label-md text-label-md">Renvoyer dans <span class="font-bold" id="timer">00:42</span></span>
</div>
<button class="font-label-md text-label-md px-6 py-2 rounded-full text-outline border border-outline-variant opacity-50 cursor-not-allowed" disabled="">
                Renvoyer
            </button>
</div>
</main>
<!-- Bottom Actions -->

<button class="w-full bg-primary-container text-on-primary py-4 rounded-full font-headline-sm text-headline-sm shadow-[0_4px_16px_rgba(15,92,86,0.15)] active:scale-95 transition-all hover:bg-primary">

<!-- Pedagogical Disclaimer -->
<p class="text-center font-label-sm text-label-sm text-text-secondary uppercase tracking-widest px-4 leading-tight opacity-70">

        </p>
</footer>
<script>
        // Simple micro-interaction for OTP auto-focus movement
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Simple Countdown logic
        let timeLeft = 42;
        const timerElement = document.getElementById('timer');
        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.parentElement.innerHTML = "Vous pouvez renvoyer le code";
            } else {
                timeLeft--;
                const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                timerElement.innerText = `00:${seconds}`;
            }
        }, 1000);
    </script>
