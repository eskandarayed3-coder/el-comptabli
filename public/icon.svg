    <rect x="348" y="240" width="24" height="20" rx="5" fill="#0F5C56"/>
    <rect x="384" y="240" width="24" height="20" rx="5" fill="#0F5C56"/>
    <rect x="312" y="268" width="24" height="20" rx="5" fill="#0F5C56"/>
    <rect x="348" y="268" width="24" height="20" rx="5" fill="#0F5C56"/>
    <rect x="384" y="268" width="24" height="20" rx="5" fill="#0F5C56"/>
    <rect x="312" y="296" width="24" height="14" rx="5" fill="#0F5C56"/>
    <rect x="348" y="296" width="24" height="14" rx="5" fill="#0F5C56"/>
    <rect x="384" y="296" width="24" height="14" rx="5" fill="#0F5C56"/>
