<style>
        @keyframes scan {
            0% { top: 0%; opacity: 0.2; }
            50% { top: 100%; opacity: 1; }
            100% { top: 0%; opacity: 0.2; }
        }
        .scan-line {
            animation: scan 3s ease-in-out infinite;
            background: linear-gradient(to bottom, transparent, #14B8A6, transparent);
            height: 4px;
            width: 100%;
            position: absolute;
            z-index: 20;
        }
        .corner-guide {
            width: 40px;
            height: 40px;
            border-color: #6df5e1;
            position: absolute;
        }
        .corner-tl { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 16px; }
        .corner-tr { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 16px; }
        .corner-bl { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 16px; }
        .corner-br { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 16px; }
        
        /* Glassmorphism for the controls */
        .glass-overlay {
            background: rgba(25, 28, 29, 0.4);
            backdrop-filter: blur(8px);
        }
    </style>

<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const shutterBtn = document.querySelector('button.group');
            const flashBtn = document.getElementById('flash-toggle');
            
            // Shutter Sound/Visual Haptic Simulation
            shutterBtn.addEventListener('click', () => {
                const flash = document.createElement('div');
                flash.className = 'fixed inset-0 bg-white z-[100] pointer-events-none opacity-0 transition-opacity duration-75';
                document.body.appendChild(flash);
                
                setTimeout(() => flash.style.opacity = '1', 10);
                setTimeout(() => flash.style.opacity = '0', 100);
                setTimeout(() => flash.remove(), 200);
            });

            // Flash Toggle Interaction
            let flashActive = true;
            flashBtn.addEventListener('click', () => {
                flashActive = !flashActive;
                const icon = flashBtn.querySelector('.material-symbols-outlined');
                icon.innerText = flashActive ? 'flash_on' : 'flash_off';
                flashBtn.classList.toggle('bg-secondary-container', flashActive);
                flashBtn.classList.toggle('text-on-secondary-container', flashActive);
                flashBtn.classList.toggle('text-white', !flashActive);
            });
        });
    </script>
