<!-- Header: TopAppBar (Transparent per prompt) -->

</div>
<div class="flex gap-stack-sm">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-all text-white">
<span class="material-symbols-outlined">schedule</span>
</button>
</div>

<!-- Picture-in-Picture Self View -->

<div class="w-full h-full bg-cover bg-center" data-alt="A portrait-oriented self-view window showing a young Tunisian entrepreneur in a brightly lit home office. The person is smiling slightly, looking into the camera. The setting features a soft green plant and a clean desk, following the warm and pedagogical atmosphere of the Serene Fiscal brand." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuATWxZhbatgHk5yz-BGswZuDaViOLQXNAp8rBUqN4J8T7zAWdWBrDan2mVYTt2x1nhm6Ncuo7rNlk7X5Y3Odwnw577_7n-M5v2-FldEJ9ZJm8dEQqnsRxCqkK5-Dl62mAepA29iceOF6r_F0o_zdcVvVRHHHbAQ9hViRe0reN621hs-qnZS2qunOqlWEDHCVf7DPcaYx7swWRQCiIbq48A9HjJghmCDnCXclWgLqfMuHfVIJnwYtwYnoPCcwMTjisd9m3Q6Vs2rsg')">

</div>
</div>

<!-- Mute (Mic Off) -->

</button>

</button>

<span class="material-symbols-outlined">screen_share</span>
</button>
<!-- End Call (Call End) - Active/Danger State -->

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">call_end</span>
</button>
</nav>
<!-- UI Overlay interactions -->
<script>
        // Simple timer logic
        let seconds = 754; // 12:34 start
        const timerElement = document.getElementById('timer');
        
        setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            timerElement.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
        }, 1000);

        // UI Toggle simulation
        function toggleState(btn) {
            const isActive = btn.classList.contains('bg-primary-container');
            if(isActive) {
                btn.classList.remove('bg-primary-container', 'text-on-primary-container');
                btn.classList.add('text-on-surface-variant');
            } else {
                btn.classList.add('bg-primary-container', 'text-on-primary-container');
                btn.classList.remove('text-on-surface-variant');
            }
        }
    </script>
<!-- Pedagogy Disclaimer Footer -->
<div class="fixed bottom-2 left-1/2 -translate-x-1/2 z-10 w-full text-center pointer-events-none">
