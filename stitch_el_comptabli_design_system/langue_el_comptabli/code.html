<!-- Atmospheric Micro-interaction Script -->
<script>
            // Simple visual feedback for language cards
            document.querySelectorAll('main section:first-of-type > div > div').forEach(card => {
                card.addEventListener('click', function() {
                    // Reset others (simulation)
                    document.querySelectorAll('main section:first-of-type > div > div').forEach(c => {
                        c.classList.remove('bg-tint-success', 'border-primary/10');
                        c.classList.add('bg-surface-container-lowest', 'border-transparent');
                        const text = c.querySelector('span:first-child');
                        if(text) text.classList.replace('text-primary', 'text-on-surface');
                        const iconCont = c.querySelector('div:last-child');
                        iconCont.innerHTML = '';
                        iconCont.classList.add('border-2', 'border-outline-variant');
                        iconCont.classList.remove('bg-primary');
                    });
                    
                    // Set current
                    this.classList.remove('bg-surface-container-lowest', 'border-transparent');
                    this.classList.add('bg-tint-success', 'border-primary/10');
                    const text = this.querySelector('span:first-child');
                    if(text) text.classList.replace('text-on-surface', 'text-primary');
                    const iconCont = this.querySelector('div:last-child');
                    iconCont.classList.remove('border-2', 'border-outline-variant');
                    iconCont.classList.add('bg-primary');
                    iconCont.innerHTML = '<span class="material-symbols-outlined text-white text-[16px] font-bold" data-icon="check">check</span>';
                });
            });
        </script>
