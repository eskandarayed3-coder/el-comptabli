<!DOCTYPE html>

<html class="light" lang="fr"><head>

                },

        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafa;
            overflow: hidden;
        }
        .pdf-preview-container {
            height: calc(100vh - 140px);
        }
        .animate-slide-up {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
    </style>
</head>
<body class="flex flex-col h-screen">
<!-- Top Navigation Bar -->
<header class="bg-background dark:bg-on-background w-full top-0 sticky z-50">
<div class="flex items-center justify-between px-container-padding py-stack-sm w-full max-w-[600px] mx-auto">
<div class="flex items-center gap-base">
<button class="active:scale-95 transition-transform text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-text-primary truncate max-w-[180px]">Facture_STEG_juillet.pdf</span>
<span class="font-label-sm text-label-sm text-text-secondary">1 / 2</span>
</div>
</div>
<div class="flex items-center gap-base">
<img alt="Assistant Logo" class="w-10 h-10 rounded-full object-cover border-2 border-surface-container-high" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBG4YfwGwukN8lvbW999KQPRo1tvVyG4OObPvzdMvm2uUVvlRZnhLZFwlp5-vxxghcsppB1jvsFdAZQSK5cexxnW7pQMMdQ4DyzBMXipJK6Tjd3AEVHPTN7QJP3BUoyWu3FCUK9IbyhfvalCycVREnuKmdGSWYeeGUPgeWRR8znGuhjsznl9fCI1HphsVUpDMcu1iixy1nSqzDpeu4Jptw107ElYjCOTeLhFJ48w_vLzGNSnepIDzI25kpYPeHgHZbQaJhH2d5Lyw"/>
<h1 class="font-headline-sm text-headline-sm text-primary font-bold hidden sm:block">Aperçu PDF</h1>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow bg-surface-container-low overflow-y-auto relative px-container-padding py-stack-sm">
<div class="max-w-[600px] mx-auto pdf-preview-container flex items-center justify-center">
<!-- Simulated PDF Document Card -->
<div class="bg-white w-full max-w-[500px] aspect-[1/1.41] rounded-pdf shadow-[0_4px_16px_rgba(15,92,86,0.08)] p-10 flex flex-col relative overflow-hidden">
<div class="flex justify-between items-start mb-12">
<div class="w-32 h-8 bg-surface-container-highest rounded-lg opacity-20"></div>
<div class="text-right">
<div class="w-24 h-4 bg-surface-container-highest rounded mb-2 opacity-30"></div>
<div class="w-32 h-4 bg-surface-container-highest rounded opacity-30"></div>
</div>
</div>
<div class="mb-12">
<div class="w-full h-1 bg-surface-container-high mb-6 opacity-40"></div>
<div class="space-y-4">
<div class="flex justify-between items-center">
<div class="w-48 h-3 bg-surface-container-high rounded opacity-30"></div>
<div class="w-16 h-3 bg-surface-container-high rounded opacity-30"></div>
</div>
<div class="flex justify-between items-center">
<div class="w-40 h-3 bg-surface-container-high rounded opacity-30"></div>
<div class="w-12 h-3 bg-surface-container-high rounded opacity-30"></div>
</div>
<div class="flex justify-between items-center">
<div class="w-56 h-3 bg-surface-container-high rounded opacity-30"></div>
<div class="w-20 h-3 bg-surface-container-high rounded opacity-30"></div>
</div>
</div>
</div>
<div class="mt-auto pt-8 border-t border-dashed border-surface-container-high">
<div class="flex justify-between items-end">
<div>
<div class="w-24 h-3 bg-surface-container-high rounded mb-2 opacity-30"></div>
<div class="w-32 h-6 bg-primary/10 rounded"></div>
</div>
<div class="text-right">
<div class="w-20 h-3 bg-surface-container-high rounded mb-2 opacity-30"></div>
<div class="w-40 h-8 bg-primary rounded-lg opacity-10"></div>
</div>
</div>
</div>
<!-- Subtle texture Overlay -->
<div class="absolute inset-0 pointer-events-none bg-[radial-gradient(#000_1px,transparent_1px)] [background-size:16px_16px] opacity-[0.03]"></div>
</div>
</div>
<!-- Floating Extracted Data Card -->
<div class="fixed bottom-32 left-1/2 -translate-x-1/2 w-[calc(100%-40px)] max-w-[420px] z-40 animate-slide-up">
<div class="bg-tint-info border border-outline-variant/30 backdrop-blur-md rounded-xl p-container-padding shadow-lg flex items-center justify-between">
<div class="flex items-center gap-stack-sm">
<div class="bg-primary-container/20 p-2 rounded-full">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1">data_thresholding</span>
</div>
<div>
<div class="flex gap-4">
<p class="font-label-md text-label-md text-on-surface">TTC: <span class="font-bold">141,134 DT</span></p>
<p class="font-label-md text-label-md text-on-surface">Date: <span class="font-bold">16/07</span></p>
</div>
<button class="text-primary font-label-sm text-label-sm font-semibold hover:underline mt-1 flex items-center gap-1">
                            Vérifier l'extraction <span class="material-symbols-outlined text-[14px]">open_in_new</span>
</button>
</div>
</div>
<button class="text-on-surface-variant hover:bg-surface-variant/20 p-1 rounded-full transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
</main>
<!-- Bottom Toolbar -->
<nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[calc(100%-40px)] max-w-[560px] z-50">
<div class="bg-surface-container-lowest/90 backdrop-blur-md shadow-[0_8px_24px_rgba(0,0,0,0.12)] rounded-full px-4 py-3 flex justify-between items-center gap-4">
<!-- Icon Group -->
<div class="flex items-center gap-1">
<button class="w-12 h-12 flex items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 rounded-full transition-colors active:scale-90">
<span class="material-symbols-outlined">zoom_in</span>
</button>
<button class="w-12 h-12 flex items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 rounded-full transition-colors active:scale-90">
<span class="material-symbols-outlined">draw</span>
</button>
<button class="w-12 h-12 flex items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 rounded-full transition-colors active:scale-90">
<span class="material-symbols-outlined">share</span>
</button>
<button class="w-12 h-12 flex items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 rounded-full transition-colors active:scale-90">
<span class="material-symbols-outlined">download</span>
</button>
</div>
<!-- CTA Button -->
<button class="bg-primary hover:bg-primary/90 text-on-primary font-label-md text-label-md px-6 py-3 rounded-full flex items-center gap-2 shadow-md active:scale-95 transition-transform">
<span>Extraire les données</span>
<span class="text-lg">✨</span>
</button>
</div>
</nav>
<!-- Small pedagogical disclaimer in footer -->
<footer class="fixed bottom-2 left-0 right-0 text-center">
<p class="font-label-sm text-label-sm text-outline px-4 bg-surface/50 inline-block rounded-full py-0.5">
            Outil pédagogique — Toujours vérifier les chiffres extraits avec l'original.
        </p>
</footer>
<script>
        // Simple click interaction for the extraction button
        const extractBtn = document.querySelector('button.bg-primary');
        extractBtn.addEventListener('click', () => {
            extractBtn.innerHTML = '<span>Analyse en cours...</span><span class="animate-spin material-symbols-outlined text-sm">progress_activity</span>';
            setTimeout(() => {
                extractBtn.innerHTML = '<span>Données extraites ✓</span>';
                setTimeout(() => {
                    extractBtn.innerHTML = '<span>Extraire les données</span><span class="text-lg">✨</span>';
                }, 2000);
            }, 1500);
        });

        // Close logic for floating card
        document.querySelector('.fixed.bottom-32 button').addEventListener('click', function() {
            this.closest('.fixed.bottom-32').style.display = 'none';
        });
    </script>
</body></html>
