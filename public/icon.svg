<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F5C56"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#ffffff"/>

  <!-- E -->
  <g fill="url(#ec)">
    <rect x="96" y="150" width="54" height="212" rx="10"/>
    <rect x="96" y="150" width="150" height="52" rx="10"/>
    <rect x="96" y="230" width="126" height="50" rx="10"/>
    <rect x="96" y="310" width="150" height="52" rx="10"/>
  </g>

  <!-- C (thick arc, opening to the right) -->
  <path fill="url(#ec)"
