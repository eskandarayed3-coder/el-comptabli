<body class="min-h-screen flex flex-col text-on-background overflow-x-hidden">

</div>
<!-- Signup Card -->
<div class="bg-white rounded-2xl p-6 md:p-8 custom-shadow border border-[#E5E7EB]/50 w-full animate-in fade-in slide-in-from-bottom-4 duration-700">
<form class="space-y-6" onsubmit="event.preventDefault()">
<!-- Nom Complet -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1">Nom complet</label>
<div class="relative">
<input class="w-full h-14 px-4 bg-surface rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-lg text-body-lg" placeholder="Ahmed Ben Salah" type="text"/>

</div>

<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>

<div class="h-1.5 flex-1 rounded-full bg-surface-container-high"></div>

                Toute information générée doit être validée par un professionnel certifié.

<!-- Micro-interaction for password toggle -->
<script>
        const passInput = document.getElementById('password-input');
        const toggleBtn = passInput.nextElementSibling;
        const icon = toggleBtn.querySelector('.material-symbols-outlined');

        toggleBtn.addEventListener('click', () => {
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passInput.type = 'password';
                icon.textContent = 'visibility';
            }
        });

        // Simple entrance animation trigger
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.bg-white');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
