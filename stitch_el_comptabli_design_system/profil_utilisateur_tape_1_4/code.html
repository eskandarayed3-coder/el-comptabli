<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-container": "#0f766e",
                    "status-warning": "#D97706",
                    "status-premium": "#7C3AED",
                    "surface-tint": "#006a63",
                    "secondary": "#006b5f",
                    "tint-info": "#EEF2FF",
                    "error-container": "#ffdad6",
                    "on-primary-container": "#a3faef",
                    "surface-variant": "#e1e3e3",
                    "surface-container": "#eceeee",
                    "on-tertiary-container": "#b3f7ee",
                    "primary-fixed-dim": "#80d5cb",
                    "outline": "#6e7977",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#eff1f1",
                    "on-primary-fixed-variant": "#00504a",
                    "on-primary-fixed": "#00201d",
                    "on-secondary-container": "#006f64",
                    "secondary-container": "#6df5e1",
                    "on-tertiary-fixed": "#00201d",
                    "background": "#f8fafa",
                    "tertiary-container": "#2f746d",
                    "secondary-fixed": "#71f8e4",
                    "secondary-fixed-dim": "#4fdbc8",
                    "error": "#ba1a1a",
                    "on-secondary-fixed": "#00201c",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed-variant": "#00504a",
                    "tertiary-fixed-dim": "#90d3cb",
                    "primary-fixed": "#9cf2e8",
                    "on-error-container": "#93000a",
                    "text-primary": "#1A1A1A",
                    "surface": "#f8fafa",
                    "tint-warning": "#FEF3E2",
                    "tertiary-fixed": "#abefe7",
                    "surface-container-high": "#e6e8e8",
                    "surface-dim": "#d8dada",
                    "on-primary": "#ffffff",
                    "surface-bright": "#f8fafa",
                    "surface-container-highest": "#e1e3e3",
                    "on-background": "#191c1d",
                    "tertiary": "#0d5b55",
                    "on-secondary": "#ffffff",
                    "on-surface": "#191c1d",
                    "text-secondary": "#6B7280",
                    "status-success": "#16A34A",
                    "outline-variant": "#bdc9c6",
                    "tint-success": "#E6F5F3",
                    "tint-danger": "#FDE8E6",
                    "inverse-surface": "#2e3131",
                    "on-secondary-fixed-variant": "#005048",
                    "inverse-primary": "#80d5cb",
                    "status-danger": "#DC2626",
                    "primary": "#005c55",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-low": "#f2f4f4",
                    "on-surface-variant": "#3e4947"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "2xl": "1.5rem",
                    "full": "9999px"
            },
            "spacing": {
                    "element-gap": "16px",
                    "container-padding": "20px",
                    "stack-sm": "12px",
                    "stack-xs": "4px",
                    "base": "8px"
            },
            "fontFamily": {
                    "label-sm": ["Inter"],
                    "headline-md": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "stat-display": ["Inter"],
                    "headline-sm": ["Inter"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                    "label-sm-mobile": ["11px", {"lineHeight": "14px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "headline-md-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "stat-display": ["30px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-sm-mobile": ["18px", {"lineHeight": "26px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .card-shadow { shadow: 0 4px 16px rgba(15, 92, 86, 0.08); }
        .selected-card { border: 2px solid #005c55; background-color: #E6F5F3; }
        .glass-effect { backdrop-filter: blur(8px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center">
<!-- Top AppBar (from Shared Components JSON Logic) -->
<header class="w-full top-0 sticky bg-background z-50 flex items-center justify-between px-container-padding h-16 max-w-[600px] mx-auto">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<div class="flex-1 px-4">
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/4 rounded-full transition-all duration-500"></div>
</div>
</div>
<div class="font-label-md text-on-surface-variant whitespace-nowrap">
            1 sur 4
        </div>
</header>
<main class="flex-1 w-full max-w-[600px] px-container-padding pt-6 pb-24 flex flex-col items-start gap-8">
<!-- Typography Section -->
<div class="space-y-2">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-text-primary tracking-tight">
                Tu es qui ?
            </h1>
<p class="font-body-lg text-body-lg text-text-secondary">
                Choisis ton profil pour personnaliser ton expérience.
            </p>
</div>
<!-- 2x2 Bento-ish Grid -->
<div class="grid grid-cols-2 gap-4 w-full">
<!-- Option 1: Freelance (SELECTED) -->
<button class="group relative text-left p-5 rounded-2xl transition-all duration-300 ring-2 ring-primary bg-tint-success flex flex-col justify-between aspect-square active:scale-[0.98]" onclick="selectProfile(this)">
<div class="flex justify-between items-start w-full">
<div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-sm">
<span class="material-symbols-outlined text-sm">check</span>
</div>
</div>
<div class="space-y-1">
<p class="font-headline-sm-mobile text-headline-sm-mobile text-primary font-bold">Freelance</p>
<p class="font-label-sm text-label-sm text-on-secondary-fixed-variant opacity-80">(graphiste, dev)</p>
</div>
</button>
<!-- Option 2: Micro-entreprise -->
<button class="group relative text-left p-5 rounded-2xl bg-surface-container-lowest transition-all duration-300 border-2 border-transparent hover:border-outline-variant flex flex-col justify-between aspect-square active:scale-[0.98] shadow-[0_4px_16px_rgba(15,92,86,0.08)]" onclick="selectProfile(this)">
<div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined">storefront</span>
</div>
<div class="space-y-1">
<p class="font-headline-sm-mobile text-headline-sm-mobile text-text-primary">Micro-entreprise</p>
<p class="font-label-sm text-label-sm text-text-secondary">(boutique, café, artisan)</p>
</div>
</button>
<!-- Option 3: Société -->
<button class="group relative text-left p-5 rounded-2xl bg-surface-container-lowest transition-all duration-300 border-2 border-transparent hover:border-outline-variant flex flex-col justify-between aspect-square active:scale-[0.98] shadow-[0_4px_16px_rgba(15,92,86,0.08)]" onclick="selectProfile(this)">
<div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined">corporate_fare</span>
</div>
<div class="space-y-1">
<p class="font-headline-sm-mobile text-headline-sm-mobile text-text-primary">Société</p>
<p class="font-label-sm text-label-sm text-text-secondary">(SARL, SUARL)</p>
</div>
</button>
<!-- Option 4: Comptable -->
<button class="group relative text-left p-5 rounded-2xl bg-surface-container-lowest transition-all duration-300 border-2 border-transparent hover:border-outline-variant flex flex-col justify-between aspect-square active:scale-[0.98] shadow-[0_4px_16px_rgba(15,92,86,0.08)]" onclick="selectProfile(this)">
<div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined">account_balance</span>
</div>
<div class="space-y-1">
<p class="font-headline-sm-mobile text-headline-sm-mobile text-text-primary">Comptable</p>
<p class="font-label-sm text-label-sm text-text-secondary">(je gère des clients)</p>
</div>
</button>
</div>
<!-- Decorative Info Card (Bento Style) -->
<div class="w-full p-6 rounded-2xl bg-tint-info flex items-center gap-4">
<div class="text-status-premium">
<span class="material-symbols-outlined text-3xl">lightbulb</span>
</div>
<p class="font-label-md text-label-md text-on-secondary-container">
                Ton choix nous aide à préparer ton calendrier fiscal personnalisé et tes obligations spécifiques.
            </p>
</div>
</main>
<!-- Footer Fixed Logic -->
<footer class="fixed bottom-0 left-0 right-0 p-container-padding bg-gradient-to-t from-background via-background/90 to-transparent flex flex-col items-center gap-4 max-w-[600px] mx-auto w-full">
<button class="w-full bg-primary-container text-on-primary-container font-headline-sm text-headline-sm h-14 rounded-full flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.97] transition-all shadow-lg">
            Continuer
            <span class="material-symbols-outlined">chevron_right</span>
</button>
<div class="bg-surface-container-low py-2 px-4 rounded-full">
<p class="font-label-sm text-label-sm text-on-surface-variant text-center leading-tight">
                Serene Fiscal est un outil pédagogique et ne remplace pas un conseil comptable certifié.
            </p>
</div>
</footer>
<script>
        function selectProfile(element) {
            // Reset all cards
            const cards = document.querySelectorAll('main button');
            cards.forEach(card => {
                card.classList.remove('ring-2', 'ring-primary', 'bg-tint-success');
                card.classList.add('bg-surface-container-lowest', 'shadow-[0_4px_16px_rgba(15,92,86,0.08)]');
                card.classList.remove('shadow-none');
                
                // Icon styling reset
                const iconContainer = card.querySelector('.rounded-xl');
                iconContainer.classList.remove('bg-primary', 'text-on-primary');
                iconContainer.classList.add('bg-surface-container', 'text-on-surface-variant');

                // Title color reset
                const title = card.querySelector('p:first-of-type');
                title.classList.remove('text-primary', 'font-bold');
                title.classList.add('text-text-primary');

                // Remove checkmark if exists
                const check = card.querySelector('.shadow-sm');
                if (check) check.remove();
            });

            // Set active state
            element.classList.add('ring-2', 'ring-primary', 'bg-tint-success');
            element.classList.remove('bg-surface-container-lowest', 'shadow-[0_4px_16px_rgba(15,92,86,0.08)]');
            
            const activeIconContainer = element.querySelector('.rounded-xl');
            activeIconContainer.classList.add('bg-primary', 'text-on-primary');
            activeIconContainer.classList.remove('bg-surface-container', 'text-on-surface-variant');

            const activeTitle = element.querySelector('p:first-of-type');
            activeTitle.classList.add('text-primary', 'font-bold');
            activeTitle.classList.remove('text-text-primary');

            // Add Checkmark
            const checkContainer = document.createElement('div');
            checkContainer.className = "w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-sm";
            checkContainer.innerHTML = `<span class="material-symbols-outlined text-sm">check</span>`;
            element.querySelector('div:first-child').appendChild(checkContainer);
        }
    </script>
</body></html>
