<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-dim": "#d8dada",
                    "on-primary-fixed-variant": "#00504a",
                    "primary": "#005c55",
                    "on-secondary-container": "#006f64",
                    "on-tertiary": "#ffffff",
                    "tertiary-fixed-dim": "#90d3cb",
                    "primary-container": "#0f766e",
                    "background": "#f8fafa",
                    "surface-container": "#eceeee",
                    "text-primary": "#1A1A1A",
                    "on-secondary-fixed": "#00201c",
                    "surface-container-low": "#f2f4f4",
                    "status-danger": "#DC2626",
                    "tertiary-container": "#2f746d",
                    "tertiary-fixed": "#abefe7",
                    "secondary": "#006b5f",
                    "tertiary": "#0d5b55",
                    "on-surface-variant": "#3e4947",
                    "surface-container-high": "#e6e8e8",
                    "on-tertiary-fixed-variant": "#00504a",
                    "secondary-fixed": "#71f8e4",
                    "surface-bright": "#f8fafa",
                    "secondary-fixed-dim": "#4fdbc8",
                    "surface-tint": "#006a63",
                    "error": "#ba1a1a",
                    "surface-container-highest": "#e1e3e3",
                    "on-background": "#191c1d",
                    "outline": "#6e7977",
                    "primary-fixed": "#9cf2e8",
                    "inverse-surface": "#2e3131",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#80d5cb",
                    "secondary-container": "#6df5e1",
                    "tint-info": "#EEF2FF",
                    "status-success": "#16A34A",
                    "outline-variant": "#bdc9c6",
                    "on-surface": "#191c1d",
                    "surface": "#f8fafa",
                    "on-primary-container": "#a3faef",
                    "on-secondary-fixed-variant": "#005048",
                    "on-error": "#ffffff",
                    "on-secondary": "#ffffff",
                    "tint-success": "#E6F5F3",
                    "tint-warning": "#FEF3E2",
                    "on-tertiary-container": "#b3f7ee",
                    "inverse-primary": "#80d5cb",
                    "tint-danger": "#FDE8E6",
                    "status-premium": "#7C3AED",
                    "on-tertiary-fixed": "#00201d",
                    "status-warning": "#D97706",
                    "surface-variant": "#e1e3e3",
                    "on-primary-fixed": "#00201d",
                    "text-secondary": "#6B7280",
                    "on-error-container": "#93000a",
                    "inverse-on-surface": "#eff1f1",
                    "on-primary": "#ffffff",
                    "error-container": "#ffdad6"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px",
                    "card": "24px"
            },
            "spacing": {
                    "element-gap": "16px",
                    "stack-sm": "12px",
                    "container-padding": "20px",
                    "base": "8px",
                    "stack-xs": "4px"
            },
            "fontFamily": {
                    "body-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-sm": ["Inter"],
                    "headline-lg": ["Inter"],
                    "stat-display": ["Inter"],
                    "label-sm": ["Inter"]
            },
            "fontSize": {
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "stat-display": ["30px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafa; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-input-focus:focus {
            outline: none;
            border-color: #005c55;
            box-shadow: 0 0 0 1px #005c55;
        }
        .progress-bar-transition {
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- Top Navigation Bar (Shared Component Strategy) -->
<header class="w-full top-0 sticky bg-background dark:bg-on-background z-50">
<div class="flex items-center justify-between px-container-padding h-16 w-full max-w-[600px] mx-auto">
<button class="hover:bg-surface-container-low transition-colors active:scale-95 transition-transform p-2 rounded-full">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm-mobile md:text-headline-sm text-primary dark:text-primary-fixed">Configuration du profil</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</div>
</header>
<main class="flex-grow w-full max-w-[600px] mx-auto px-container-padding py-6 flex flex-col items-center">
<!-- Step Indicator & Progress -->
<div class="w-full mb-8">
<div class="flex justify-between items-center mb-4">
<span class="text-label-sm font-label-sm text-on-surface-variant">ÉTAPE 2 SUR 4</span>
<span class="text-label-sm font-label-sm text-primary font-bold">50% complété</span>
</div>
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary progress-bar-transition" style="width: 50%;"></div>
</div>
</div>
<!-- Title Section -->
<div class="text-center mb-8">
<h2 class="font-headline-md text-headline-md text-text-primary mb-2">Ton activité</h2>
<p class="font-body-lg text-body-lg text-text-secondary">Parle-nous un peu de ton projet</p>
</div>
<!-- Form Card -->
<section class="w-full bg-surface-container-lowest rounded-card p-6 shadow-[0_4px_16px_rgba(15,92,86,0.08)] mb-8">
<form class="flex flex-col gap-6">
<!-- Activity Name -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-text-primary">Nom de l'activité</label>
<input class="w-full h-14 px-4 rounded-xl border border-outline-variant bg-surface-container-low font-body-lg text-body-lg form-input-focus transition-all text-on-background placeholder:text-on-surface-variant/50" placeholder="Studio Eskandar Design" type="text"/>
</div>
<!-- City Dropdown -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-text-primary">Ville</label>
<div class="relative">
<select class="w-full h-14 px-4 appearance-none rounded-xl border border-outline-variant bg-surface-container-low font-body-lg text-body-lg form-input-focus transition-all text-on-background">
<option value="Tunis">Tunis</option>
<option selected="" value="Nabeul">Nabeul</option>
<option value="Sousse">Sousse</option>
<option value="Sfax">Sfax</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-4 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Sector Dropdown -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-text-primary">Secteur</label>
<div class="relative">
<select class="w-full h-14 px-4 appearance-none rounded-xl border border-outline-variant bg-surface-container-low font-body-lg text-body-lg form-input-focus transition-all text-on-background">
<option selected="" value="Services numériques">Services numériques</option>
<option value="Artisanat">Artisanat</option>
<option value="Commerce">Commerce</option>
<option value="Consulting">Consulting</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-4 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Fiscal ID -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-text-primary">Matricule fiscal (optionnel)</label>
<span class="material-symbols-outlined text-outline-variant text-base cursor-help" title="Identifiant unique délivré par le fisc">info</span>
</div>
<input class="w-full h-14 px-4 rounded-xl border border-outline-variant bg-surface-container-low font-body-lg text-body-lg form-input-focus transition-all text-on-background placeholder:text-on-surface-variant/50" placeholder="1234567/A/M/000" type="text"/>
</div>
</form>
</section>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-4 items-center">
<button class="w-full h-14 bg-primary-container text-on-primary rounded-full font-headline-sm text-headline-sm flex items-center justify-center shadow-lg active:scale-95 transition-transform">
                Continuer
            </button>
<button class="text-primary font-label-md text-label-md hover:underline decoration-2 underline-offset-4 px-6 py-2 transition-all">
                Plus tard
            </button>
</div>
</main>
<!-- Footer Disclaimer -->
<footer class="w-full mt-auto py-6 px-container-padding text-center bg-surface-container-low/50">
<div class="max-w-[500px] mx-auto flex flex-col gap-2">
<p class="font-label-sm text-label-sm text-on-surface-variant leading-relaxed">
                El Comptabli est un outil pédagogique d'aide à la gestion fiscale. 
                Les informations fournies ne remplacent pas les conseils d'un expert-comptable certifié.
            </p>
</div>
</footer>
<!-- Animated Element: Subtle floating sphere for atmosphere -->
<div class="fixed top-1/4 -right-20 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="fixed bottom-1/4 -left-20 w-64 h-64 bg-secondary-container/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
<script>
        // Simple micro-interaction for progress bar
        window.addEventListener('DOMContentLoaded', () => {
            const progress = document.querySelector('.progress-bar-transition');
            if(progress) {
                progress.style.width = '0%';
                setTimeout(() => {
                    progress.style.width = '50%';
                }, 100);
            }
        });

        // Input active state simulation
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
                input.parentElement.style.transition = 'transform 0.2s ease-out';
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
</body></html>
