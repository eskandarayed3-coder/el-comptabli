            </p>

<!-- Script for interactive selection visual feedback -->
<script>
        const radioInputs = document.querySelectorAll('input[type="radio"]');
        radioInputs.forEach(input => {
            input.addEventListener('change', (e) => {
                // Clear all states
                document.querySelectorAll('label > div').forEach(div => {
                    div.classList.remove('bg-tint-success', 'border-primary', 'shadow-[0_4px_16px_rgba(15,92,86,0.08)]');
                    div.classList.add('bg-surface-container-lowest', 'border-transparent');
                    
                    const indicator = div.querySelector('div:last-child');
                    if(indicator && indicator.classList.contains('bg-primary')) {
                       indicator.classList.replace('bg-primary', 'border-outline-variant');
                       indicator.classList.add('border-2');
                       indicator.innerHTML = '';
                    }
                });

                // Apply active state
                const container = e.target.nextElementSibling;
                container.classList.replace('bg-surface-container-lowest', 'bg-tint-success');
                container.classList.replace('border-transparent', 'border-primary');
                container.classList.add('shadow-[0_4px_16px_rgba(15,92,86,0.08)]');
                
                const indicator = container.querySelector('.rounded-full:last-child');
                indicator.classList.remove('border-2', 'border-outline-variant');
                indicator.classList.add('bg-primary');
                indicator.innerHTML = '<span class="material-symbols-outlined text-white text-[18px]" style="font-variation-settings: \'FILL\' 1;">check</span>';
            });
        });
    </script>
